<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>turnmap: see what your Pydantic AI agent actually did</title>
    <meta
      name="description"
      content="Paste the message history of a Pydantic AI run and see every prompt, model response, tool call, tool return and retry as a graph. Runs entirely in your browser."
    />
    <meta property="og:title" content="turnmap" />
    <meta
      property="og:description"
      content="Visualize Pydantic AI message histories as an interactive graph. Nothing leaves your browser."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fafafa"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1c1c1f"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the stored theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem("turnmap.theme")
        var dark =
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
