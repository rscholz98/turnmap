name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build:lib
      - run: npm test
      # Trusted publishing: the package on npmjs.com lists this repository and
      # workflow as a trusted publisher, so no token is needed.
      - run: npm publish --provenance --access public
        working-directory: packages/turnmap
